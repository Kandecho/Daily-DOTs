<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" href="data:,">
<style>
{{STYLE}}
</style>
<script>
{{THEME_JS}}
</script>
</head>
<body class="flip">
<main class="deck" id="deck">
{{PAGES}}
</main>
<script>
(function () {
  // 翻页：横向 scroll-snap 负责滑动；方向键和目录链接换算成页码再滚动
  var deck = document.getElementById("deck"), pages = deck.children;
  var smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  function cur() { return Math.round(deck.scrollLeft / deck.clientWidth); }
  function go(i, instant) {
    i = Math.max(0, Math.min(pages.length - 1, i));
    pages[i].scrollTop = 0;
    deck.scrollTo({ left: i * deck.clientWidth, behavior: instant || !smooth ? "auto" : "smooth" });
  }
  function sync() {
    var i = cur();
    document.body.classList.toggle("on-cover", i === 0);
    document.body.classList.toggle("on-x", pages[i].classList.contains("pg-x"));
  }
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(cur() + 1);
    else if (e.key === "ArrowLeft") go(cur() - 1);
  });
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#p"]');
    if (!a) return;
    // 回目录保留原生锚点跳转，不依赖 scrollTo 或脚本状态；脚本可用时顺便复位目录页内滚动。
    if (a.classList.contains("to-toc")) { pages[0].scrollTop = 0; return; }
    e.preventDefault();
    go(+a.getAttribute("href").slice(2));
  });
  var ticking = false;
  deck.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; sync(); });
  });
  var at = 0;
  addEventListener("resize", function () { deck.scrollLeft = at * deck.clientWidth; });
  deck.addEventListener("scrollend", function () { at = cur(); });
  var m = /^#p(\d+)$/.exec(location.hash);
  if (m) go(+m[1], true);
  at = cur();
  sync();
  addEventListener("beforeprint", function () { deck.scrollLeft = 0; });
})();
</script>
</body>
</html>
